<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古建筑榫卯语料库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Serif SC", "Microsoft Yahei", "SimSun", serif;
        }

        body {
            background-color: #f9f6f0;
            padding: 20px;
            background-image: linear-gradient(rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.92)),
                url("https://img2.baidu.com/it/u=1500500394,250000000&fm=253&fmt=auto&app=138&f=JPEG?w=1200&h=800");
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #333;
            line-height: 1.7;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            background: #fff;
            padding: 60px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(139, 69, 19, 0.15);
            border: 1px solid #e6d9c8;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            padding-bottom: 20px;
        }

        .header h1 {
            color: #8B4513;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .header p {
            color: #666;
            font-size: 18px;
            font-style: italic;
        }

        .header::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #8B4513, transparent);
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 50px;
            align-items: center;
        }

        .search-box {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 800px;
            align-items: center;
        }

        #keyword {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #d3b897;
            border-radius: 8px;
            font-size: 17px;
            outline: none;
            transition: all 0.3s ease;
            background: #fdfbf8;
        }

        #keyword:focus {
            border-color: #8B4513;
            box-shadow: 0 0 12px rgba(139, 69, 19, 0.18);
            background: #fff;
        }

        #keyword::placeholder {
            color: #999;
            font-style: italic;
        }

        #search-btn {
            padding: 16px 35px;
            background-color: #8B4513;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 500;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        #search-btn:hover {
            background-color: #A0522D;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(139, 69, 19, 0.2);
        }

        #search-btn:active {
            transform: translateY(-1px);
        }

        .search-tips {
            color: #777;
            font-size: 15px;
            max-width: 800px;
            text-align: center;
            line-height: 1.6;
        }

        .search-tips span {
            color: #8B4513;
            font-weight: bold;
        }

        .result-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 20px;
            background: #f8f5f0;
            border-radius: 8px;
            border-left: 4px solid #8B4513;
            flex-wrap: wrap;
            gap: 15px;
        }

        .result-count {
            font-size: 16px;
            color: #555;
        }

        .result-count span {
            color: #8B4513;
            font-weight: bold;
            font-size: 18px;
        }

        .category-filter {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .category-filter label {
            font-size: 15px;
            color: #555;
        }

        .category-filter select {
            padding: 8px 15px;
            border: 1px solid #d3b897;
            border-radius: 6px;
            background: #fff;
            font-size: 15px;
            color: #333;
            outline: none;
            cursor: pointer;
            min-width: 130px;
        }

        .category-filter select:disabled {
            background: #f0ece6;
            color: #999;
            cursor: not-allowed;
        }

        .result-list {
            display: grid;
            gap: 25px;
            grid-template-columns: repeat(auto-fill, minmax(550px, 1fr));
        }

        .result-item {
            padding: 30px;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fff;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .result-item::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #8B4513;
            transition: all 0.3s ease;
        }

        .result-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            border-color: #d3b897;
        }

        .result-item:hover::before {
            width: 8px;
        }

        .item-header {
            margin-bottom: 20px;
            border-bottom: 1px dashed #e6d9c8;
            padding-bottom: 15px;
        }

        .item-name {
            font-size: 24px;
            color: #8B4513;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .item-english {
            font-size: 15px;
            color: #666;
            font-style: italic;
        }

        .item-tags {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .item-category {
            display: inline-block;
            padding: 5px 12px;
            background: #f0e8d8;
            color: #8B4513;
            border-radius: 20px;
            font-size: 14px;
        }

        .item-category.primary {
            background: #8B4513;
            color: #fff;
        }

        .item-content {
            font-size: 16px;
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px 15px;
        }

        .item-label {
            font-weight: bold;
            color: #8B4513;
            text-align: right;
            padding-right: 10px;
            border-right: 1px solid #f0e8d8;
        }

        .item-value {
            color: #444;
        }

        .item-reference {
            font-family: "Courier New", monospace;
            color: #2c5282;
            word-break: break-all;
        }

        .item-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-completed {
            background: #f0f9f0;
            color: #2e7d32;
        }

        .empty-result {
            text-align: center;
            padding: 80px 20px;
            background: #f8f5f0;
            border-radius: 12px;
            margin: 30px 0;
        }

        .empty-result .icon {
            font-size: 50px;
            color: #d3b897;
            margin-bottom: 20px;
        }

        .empty-result h3 {
            color: #8B4513;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .empty-result p {
            color: #777;
            font-size: 17px;
            max-width: 600px;
            margin: 0 auto;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f0e8d8;
            border-top: 5px solid #8B4513;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading p {
            color: #8B4513;
            font-size: 18px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 50px;
            padding: 20px 0;
        }

        .page-btn {
            padding: 10px 18px;
            border: 1px solid #d3b897;
            border-radius: 6px;
            background: #fff;
            color: #8B4513;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .page-btn:hover {
            background: #f8f5f0;
            border-color: #8B4513;
        }

        .page-btn.active {
            background: #8B4513;
            color: #fff;
            border-color: #8B4513;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f8f5f0;
            color: #999;
            border-color: #eee;
        }

        .page-info {
            font-size: 16px;
            color: #666;
        }

        @media (max-width: 1200px) {
            .result-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 28px;
                letter-spacing: 2px;
            }

            .search-box {
                flex-direction: column;
                gap: 12px;
            }

            #keyword,
            #search-btn {
                width: 100%;
            }

            .result-info {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .category-filter {
                justify-content: center;
                width: 100%;
            }

            .item-content {
                grid-template-columns: 1fr;
            }

            .item-label {
                text-align: left;
                padding-right: 0;
                border-right: none;
                border-bottom: 1px solid #f0e8d8;
                padding-bottom: 5px;
                margin-bottom: 5px;
            }

            .pagination {
                flex-wrap: wrap;
                gap: 8px;
            }

            .page-btn {
                padding: 8px 12px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }

            .search-tips {
                font-size: 14px;
            }

            .item-name {
                font-size: 20px;
            }

            .item-content {
                font-size: 15px;
            }
        }
        .item-image {
            margin-bottom: 20px;
            text-align: center;
            background: #faf7f2;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #f0e8d8;
        }

        .item-image img {
            max-width: 100%;
            max-height: 260px;
            width: auto;
            height: auto;
            border-radius: 6px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            transition: transform 0.3s ease;
        }

        .item-image img:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>榫卯昭鉴</h1>
            <p>古建筑榫卯结构与文化内涵双证对照语料库</p>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="keyword" placeholder="输入关键词检索（如：燕尾榫、榫卯类、GB/T 37646-2019、《中国建筑图解词典》）">
                <button id="search-btn">检索</button>
            </div>
            <div class="search-tips">
                <br><span>检索范围：中文术语、英文翻译、定义说明、文化注释、参考文献、一级分类、二级分类</span>
                （示例：搜索"榫卯"获取所有榫卯类数据，搜索"GB"获取标准文献相关数据）</br>
            </div>
        </div>

        <div class="result-info" style="display: none;">
            <div class="result-count">找到 <span id="total-count">0</span> 条相关语料</div>
            <div class="category-filter">
                <label for="primary-select">一级分类：</label>
                <select id="primary-select">
                    <option value="all">全部大类</option>
                </select>
                <label for="category-select">二级分类：</label>
                <select id="category-select" disabled>
                    <option value="all">全部二级</option>
                </select>
            </div>
        </div>

        <div id="result-container">
            <div class="empty-result">
                <div class="icon">📚</div>
                <h3>欢迎使用榫卯昭鉴语料库</h3>
                <p>本语料库收录204条古建筑榫卯相关数据，包含中文术语、英文翻译、定义说明、文化注释、参考文献等完整信息<br>请在上方输入关键词进行检索，或使用分类筛选功能浏览（若使用分类筛选功能，请直接点击上方检索按钮）
                </p>
            </div>
        </div>

        <div id="pagination" class="pagination" style="display: none;">
            <button class="page-btn" id="prev-page" disabled>上一页</button>
            <span class="page-info"><span id="current-page">1</span>/<span id="total-pages">1</span> 页</span>
            <button class="page-btn" id="next-page" disabled>下一页</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 一级分类 → 二级分类 映射表
        // ============================================================
        const categoryTree = {
            "榫卯类": ["榫卯类"],
            "斗拱类": ["斗拱类"],
            "屋架类": ["屋架", "屋架构件", "屋顶结构", "屋顶构件", "屋顶瓦作", "屋顶样式", "屋顶装修", "草架", "特殊构件", "梁枋构件"],
            "屋顶类": ["屋顶样式", "屋顶结构", "屋顶构件", "屋顶瓦作", "屋顶装修"],
            "装饰类": ["建筑装饰", "墙体类", "门窗", "构件", "楼梯类", "排水类"],
            "台基与柱类": ["台基", "台基柱类", "柱类"]
        };

        // ============================================================
        // 语料库完整数据（204条）
        // 每条数据新增 primaryCategory 字段
        // ============================================================
        const corpusData = [
            { "id": 1, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "榫卯", "englishName": "Mortise and Tenon Joint", "definition": "中国传统木构的凹凸咬合连接构造，是所有木作节点的统称，依靠构件几何咬合，无需金属钉即可稳固连接。", "culturalNote": "起源于7000年前河姆渡文化，不用铁钉即可使构件牢固结合，体现了“以柔克刚”“阴阳互补”的哲学思想。", "reference": "《清式营造则例》梁思成", "status": "已完成", "image": "./images/sun/sun1.png" },
            { "id": 2, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "燕尾榫", "englishName": "Dovetail Joint", "definition": "多用于古建小木作，用于博风板、山花板拼接，梯形榫头相互锁合，防止板材受拉力拉开。", "culturalNote": "因形似燕尾而得名，梯形结构越拉越紧，常用于抽屉、箱柜等需要承受拉力的部位。", "reference": "《中国古建筑木作营造技术》马炳坚", "status": "已完成", "image": "./images/sun/sun2.png" },
            { "id": 3, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "银锭榫", "englishName": "Dovetailed Tenon", "definition": "木板拼接构件，形似银锭，用于山花板、博风板的板缝拉结，古建筑又称银锭扣。", "culturalNote": "因形似古代银锭而得名，两头宽中间细的结构使其嵌入后无法脱出，是古代用于防止拼缝开裂的经典做法。", "reference": "《中国古建筑木作营造技术》马炳坚", "status": "已完成", "image": "./images/sun/sun3.png" },
            { "id": 4, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "长短榫", "englishName": "Long and Short Tenons", "definition": "木柱上下端成对设置一长一短榫头，用来固定柱身，限制位移，抵抗建筑侧移。", "culturalNote": "常用于腿足与面板连接，两个榫头一长一短，既能增加接触面，又能防止面板翘曲变形。", "reference": "《清式营造则例》梁思成", "status": "已完成", "image": "./images/sun/sun4.png" },
            { "id": 5, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "穿带", "englishName": "Through Strap Tenon", "definition": "镶嵌在大门板、望板内部的长条木件，约束木板，分散板面应力，防止板面翘曲变形。", "culturalNote": "用于桌面、柜门等拼板背面，梯形长榫穿入燕尾槽后越推越紧，是解决木材缩涨问题的巧妙方法。", "reference": "《中国古建筑木作营造技术》马炳坚", "status": "已完成", "image": "./images/sun/sun5.png" },
            { "id": 6, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "半榫", "englishName": "Blind Tenon", "definition": "梁枋与柱子相交使用，榫头插入柱内但不穿透柱身，多用于边柱、山柱节点。", "culturalNote": "榫头深度小于构件厚度，使家具外表面整洁美观，多用于高档家具。", "reference": "《清式营造则例》梁思成", "status": "已完成", "image": "./images/sun/sun6.png" },
            { "id": 7, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "透榫", "englishName": "Through Tenon", "definition": "梁枋榫头贯穿整个柱身，可有效传递构件之间的拉力，多用于檐柱受力节点。", "culturalNote": "榫头完全穿透构件，在大木作和民间家具中常见，既增加结构强度又有装饰效果。", "reference": "《清式营造则例》梁思成", "status": "已完成", "image": "./images/sun/sun7.png" },
            { "id": 8, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "明榫", "englishName": "Exposed Tenon", "definition": "外露型榫头，装配完成后榫头露在构件外侧，加工简单，常见于次要木作构件。", "culturalNote": "常用于民间家具和建筑大木作，便于加工和维修，体现质朴的工艺美学。", "reference": "《中国古建筑木作营造技术》马炳坚", "status": "已完成", "image": "./images/sun/sun7.png" },
            { "id": 9, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "暗榫", "englishName": "Concealed Tenon", "definition": "榫头完全藏于构件内部，完工后外部无法看见榫头，外观整洁，多用于小木作。", "culturalNote": "榫头完全隐藏，是精细工艺的体现，多用于高档家具，加工难度高于明榫。", "reference": "《中国古建筑木作营造技术》马炳坚", "status": "已完成", "image": "./images/sun/sun9.png" },
            { "id": 10, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "企口榫", "englishName": "Tongue and Groove Joint", "definition": "用于屋面望板、木楼板，板边凹凸互补拼接，使板面拼合严密，防止漏风漏雨。", "culturalNote": "一条边做凸起的榫舌，另一条边做凹进的榫槽，常用于地板、墙板拼合，防止透光和错位。", "reference": "《中国古建筑木作营造技术》马炳坚", "status": "已完成", "image": "./images/sun/sun10.png" },
            { "id": 11, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "槽口榫", "englishName": "Grooved Tenon", "definition": "墙板、木盖板之间的侧向咬合拼接榫卯，板件侧边开槽对接，用于围护木板拼接。", "culturalNote": "在板材边缘开槽，另一块板材对应部位做成凸榫插入，常用于箱柜类家具背板。", "reference": "《中国古建筑木作营造技术》马炳坚", "status": "已完成", "image": "./images/sun/sun11.png" },
            { "id": 12, "primaryCategory": "榫卯类", "category": "榫卯类", "name": "龙凤榫", "englishName": "Dragon-phoenix Tenon", "definition": "长木板拼合使用，凹凸槽口更长，增大拼板接触面，提升大板整体性。", "culturalNote": "拼板时使用，将薄板边缘刨出半个银锭形榫，推入相邻板边的槽口中，常用于桌案面心板。", "reference": "《中国古建筑木作营造技术》马炳坚", "status": "已完成", "image": "./images/sun/sun12.png" },

            { "id": 75, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "齐心斗", "englishName": "Qixindou", "definition": "宋式，横栱正中的斗，承托上层枋或栱。", "culturalNote": "位于构件中心，均衡传力。", "reference": "《<营造法式>解读》", "status": "已完成","image": "./images/dou/dou35.png"  },
            { "id": 76, "primaryCategory": "屋顶类", "category": "屋顶样式", "name": "庑殿顶", "englishName": "Wudian / Hip roof", "definition": "由四面坡组成，有一条正脊和四条垂脊。又称“四阿顶”。", "culturalNote": "中国古代建筑中等级最高的屋顶样式，常用于皇宫、庙宇的主殿。", "reference": "《中国建筑图解词典》", "status": "已完成","image": "./images/wu/wu1.png"  },
            { "id": 77, "primaryCategory": "屋顶类", "category": "屋顶样式", "name": "歇山顶", "englishName": "Xieshan / Hip-and-gable roof", "definition": "由上部悬山与下部庑殿结合而成，即“九脊殿”（一条正脊、四条垂脊、四条戗脊）。", "culturalNote": "等级仅次于庑殿顶，多用于宫殿、园林、寺观，造型优美。", "reference": "《中国建筑图解词典》", "status": "已完成","image": "./images/wu/wu2.png"  },
            { "id": 78, "primaryCategory": "屋顶类", "category": "屋顶样式", "name": "悬山顶", "englishName": "Xuanshan / Overhanging gable roof", "definition": "屋檐两端伸出山墙之外，以保护山墙。", "culturalNote": "南方多用，利于防雨；等级低于歇山顶，常见于民居。", "reference": "《中国建筑图解词典》", "status": "已完成","image": "./images/wu/wu3.png"  },
            { "id": 79, "primaryCategory": "屋顶类", "category": "屋顶样式", "name": "硬山顶", "englishName": "Yingshan / Flush gable roof", "definition": "山墙与屋面齐平或略高，不挑出。", "culturalNote": "明代以后广泛使用，利于防火（封火墙），常见于北方民居。", "reference": "《中国建筑图解词典》", "status": "已完成","image": "./images/wu/wu4.png"  },

            { "id": 89, "primaryCategory": "屋架类", "category": "屋架", "name": "月梁", "englishName": "Yueliang / Crescent beam", "definition": "经过艺术加工的梁，断面呈弧形，似新月，两端削成卷杀弧度。", "culturalNote": "多用于高级殿宇，形态优美，是技术与艺术的完美结合。", "reference": "《中国建筑图解词典》", "status": "已完成","image": "./images/wu/wu14.png"  },

            { "id": 192, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "仿木斗拱", "englishName": "Imitation-wood Dougong", "definition": "砖石塔上用砖石雕刻模仿木构斗拱的做法，完整“翻译”木斗拱的形态与出跳。", "culturalNote": "辽代砖塔典型做法，燃灯塔密檐叠涩即模仿木构出挑，体现南北工匠合作。", "reference": "《中国建筑史》", "status": "已完成","image": "./images/dou/dou38.png"  },
            { "id": 193, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "柱头铺作", "englishName": "Zhutou Puzuo", "definition": "宋式斗拱，安装在柱头上的铺作，承重最大。", "culturalNote": "清称柱头科，宋式核心承重铺作，位于柱头之上。", "reference": "《〈营造法式〉解读》", "status": "已完成","image": "./images/dou/dou39.png"  },
            { "id": 194, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "栌斗", "englishName": "Ludou", "definition": "宋式斗拱最下层的大斗，清称“坐斗”。", "culturalNote": "位于柱头或阑额之上，是全朵铺作的承重核心，开十字卯口承托翘、昂与栱。", "reference": "《〈营造法式〉解读》", "status": "已完成","image": "./images/dou/dou40.png"  },
            { "id": 195, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "散斗", "englishName": "Sandou", "definition": "宋式横栱两端的斗，清称“三才升”。", "culturalNote": "承托上层栱或枋，仅开一字口，体量小于交互斗。", "reference": "《〈营造法式〉解读》", "status": "已完成","image": "./images/dou/dou41.png"  },
            { "id": 196, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "万栱", "englishName": "Wangong", "definition": "清式斗拱中长度最长的横栱，宋称“慢栱”。", "culturalNote": "位于泥道栱或瓜栱之上，承托上层枋木，是斗拱中横向构件最长者。", "reference": "《清式营造则例》", "status": "已完成","image": "./images/dou/dou42.png"  },
            { "id": 197, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "瓜栱", "englishName": "Guagong", "definition": "清式斗拱中长度最短的横栱，宋称“瓜子栱”。", "culturalNote": "跳头第一层横栱，形制短小，承托万栱。", "reference": "《清式营造则例》", "status": "已完成","image": "./images/dou/dou43.png"  },
            { "id": 198, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "坐斗", "englishName": "Zuodou", "definition": "清式斗拱最下层的大斗，宋称“栌斗”。", "culturalNote": "一攒斗拱的承重基础，开十字卯口承托翘、昂与栱。", "reference": "《清式营造则例》", "status": "已完成","image": "./images/dou/dou44.png"  },
            { "id": 199, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "麻叶头", "englishName": "Mayetou", "definition": "清式翘、昂后尾的雕饰构件。", "culturalNote": "“三弯九转”做法，线条圆润如云头，兼具装饰与结构功能。", "reference": "《清式营造则例》", "status": "已完成","image": "./images/dou/dou45.png"  },
            { "id": 200, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "溜金斗拱", "englishName": "Liujin Dougong", "definition": "清式斗拱，后尾延伸至金檩之下。", "culturalNote": "外檐斗拱的特殊形式，后尾起杠杆作用挑托金檩。", "reference": "《清式营造则例》", "status": "已完成","image": "./images/dou/dou46.png"  },
            { "id": 201, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "隔架科", "englishName": "Gejiake", "definition": "清式内檐斗拱，置于梁与随梁枋之间。", "culturalNote": "缩短梁的净跨，起承托与稳定作用。", "reference": "《中国古建筑术语辞典》", "status": "已完成","image": "./images/dou/dou47.png"  },
            { "id": 202, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "品字科", "englishName": "Pinzike", "definition": "清式内檐斗拱，三攒一组呈品字形排列。", "culturalNote": "用于殿内金柱之间，承托天花或上层梁架。", "reference": "《清式营造则例》", "status": "已完成","image": "./images/dou/dou48.png"  },
            { "id": 203, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "一斗三升", "englishName": "Yidou Sansheng", "definition": "最简单的斗拱组合，栌斗上承横栱，两端各置一升。", "culturalNote": "汉代已见雏形，是斗拱发展的早期形态。", "reference": "《中国建筑史》", "status": "已完成","image": "./images/dou/dou49.png"  },
            { "id": 204, "primaryCategory": "斗拱类", "category": "斗拱类", "name": "重栱造", "englishName": "Chonggongzao", "definition": "宋式斗拱，跳头施两层横栱（瓜子栱+慢栱）。", "culturalNote": "与单栱造相对，结构更稳固，等级更高。", "reference": "《〈营造法式〉解读》", "status": "已完成","image": "./images/dou/dou50.png"  }
        ];

        // ============================================================
        // 全局变量
        // ============================================================
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 10;

        const keywordInput = document.getElementById('keyword');
        const searchBtn = document.getElementById('search-btn');
        const resultContainer = document.getElementById('result-container');
        const resultInfo = document.querySelector('.result-info');
        const totalCountSpan = document.getElementById('total-count');
        const primarySelect = document.getElementById('primary-select');
        const categorySelect = document.getElementById('category-select');
        const pagination = document.getElementById('pagination');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const currentPageSpan = document.getElementById('current-page');
        const totalPagesSpan = document.getElementById('total-pages');

        // ============================================================
        // 初始化一级分类下拉
        // ============================================================
        function initPrimaryFilter() {
            const primaries = [...new Set(corpusData.map(item => item.primaryCategory))];
            primaries.forEach(p => {
                const option = document.createElement('option');
                option.value = p;
                option.textContent = p;
                primarySelect.appendChild(option);
            });
        }

        // ============================================================
        // 根据一级分类联动二级分类下拉
        // ============================================================
        function updateSecondaryOptions() {
            const primary = primarySelect.value;
            // 清空二级
            categorySelect.innerHTML = '<option value="all">全部二级</option>';

            if (primary === 'all') {
                categorySelect.disabled = true;
                return;
            }
            categorySelect.disabled = false;

            // 从数据中提取该一级分类下实际存在的二级分类
            const secondaries = [...new Set(
                corpusData
                    .filter(item => item.primaryCategory === primary)
                    .map(item => item.category)
            )];
            secondaries.forEach(s => {
                const option = document.createElement('option');
                option.value = s;
                option.textContent = s;
                categorySelect.appendChild(option);
            });
        }

        // ============================================================
        // 搜索 + 筛选核心逻辑
        // ============================================================
        function searchCorpus() {
            const keyword = keywordInput.value.trim().toLowerCase();
            showLoading();

            setTimeout(() => {
                // 1. 关键词过滤
                if (keyword) {
                    filteredData = corpusData.filter(item =>
                        item.name.toLowerCase().includes(keyword) ||
                        item.englishName.toLowerCase().includes(keyword) ||
                        item.definition.toLowerCase().includes(keyword) ||
                        item.culturalNote.toLowerCase().includes(keyword) ||
                        item.reference.toLowerCase().includes(keyword) ||
                        item.category.toLowerCase().includes(keyword) ||
                        item.primaryCategory.toLowerCase().includes(keyword) ||
                        item.status.toLowerCase().includes(keyword)
                    );
                } else {
                    filteredData = [...corpusData];
                }

                // 2. 一级分类过滤
                const primary = primarySelect.value;
                if (primary !== 'all') {
                    filteredData = filteredData.filter(item => item.primaryCategory === primary);
                }

                // 3. 二级分类过滤
                const secondary = categorySelect.value;
                if (secondary !== 'all') {
                    filteredData = filteredData.filter(item => item.category === secondary);
                }

                currentPage = 1;
                renderResults();
                updatePagination();
                resultInfo.style.display = 'flex';
            }, 300);
        }

        // ============================================================
        // 渲染结果
        // ============================================================
        function renderResults() {
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const currentPageData = filteredData.slice(startIndex, endIndex);

            if (filteredData.length === 0) {
                showEmptyResult();
                pagination.style.display = 'none';
                return;
            }

            let resultHtml = '<div class="result-list">';
            currentPageData.forEach(item => {
                resultHtml += `
                    <div class="result-item">
                        <div class="item-header">
                            <div class="item-name">${item.name}</div>
                            <div class="item-english">${item.englishName}</div>
                            <div class="item-tags">
                                <span class="item-category primary">${item.primaryCategory}</span>
                                <span class="item-category">${item.category}</span>
                            </div>
                        </div>
                         ${item.image ? `
                            <div class="item-image">
                                <img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.parentElement.style.display='none'">
                            </div>` : ''}
                        <div class="item-content">
                            <div class="item-label">定义说明：</div>
                            <div class="item-value">${item.definition}</div>
                            <div class="item-label">文化注释：</div>
                            <div class="item-value">${item.culturalNote}</div>
                            <div class="item-label">参考文献：</div>
                            <div class="item-value item-reference">${item.reference}</div>
                            <div class="item-label">数据状态：</div>
                            <div class="item-value">
                                <span class="item-status status-completed">${item.status}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            resultHtml += '</div>';
            resultContainer.innerHTML = resultHtml;
            totalCountSpan.textContent = filteredData.length;
            pagination.style.display = 'flex';
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            currentPageSpan.textContent = currentPage;
            totalPagesSpan.textContent = totalPages;
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages || filteredData.length === 0;
        }

        function showLoading() {
            resultContainer.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在检索语料，请稍候...</p>
                </div>
            `;
            resultInfo.style.display = 'none';
            pagination.style.display = 'none';
        }

        function showEmptyResult() {
            resultContainer.innerHTML = `
                <div class="empty-result">
                    <div class="icon">🔍</div>
                    <h3>未找到相关语料</h3>
                    <p>请尝试调整关键词或分类筛选条件<br>建议使用更宽泛的关键词，或查看全部语料</p>
                </div>
            `;
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderResults();
                updatePagination();
                resultContainer.scrollIntoView({ behavior: 'smooth' });
            }
        });

        nextPageBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderResults();
                updatePagination();
                resultContainer.scrollIntoView({ behavior: 'smooth' });
            }
        });

        // 一级分类变化 → 联动二级 → 自动搜索
        primarySelect.addEventListener('change', () => {
            updateSecondaryOptions();
            searchCorpus();
        });

        // 二级分类变化 → 自动搜索
        categorySelect.addEventListener('change', searchCorpus);

        searchBtn.addEventListener('click', searchCorpus);

        keywordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchCorpus();
        });

        window.addEventListener('load', () => {
            initPrimaryFilter();
            updateSecondaryOptions();
            keywordInput.focus();
        });
    </script>
</body>

</html>
