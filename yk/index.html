
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古建筑榫卯语料库</title>
    <style>
        /* 全局样式重置与基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Serif SC", "Microsoft Yahei", "SimSun", serif;
        }

        /* 背景样式 - 古风木纹效果 */
        body {
            background-color: #f9f6f0;
            padding: 20px;
            background-image: linear-gradient(rgba(255,255,255,0.92), rgba(255,255,255,0.92)), 
                              url("https://img2.baidu.com/it/u=1500500394,250000000&fm=253&fmt=auto&app=138&f=JPEG?w=1200&h=800");
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #333;
            line-height: 1.7;
        }

        /* 容器样式 - 仿古卷轴效果 */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            background: #fff;
            padding: 60px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(139, 69, 19, 0.15);
            border: 1px solid #e6d9c8;
            position: relative;
            overflow: hidden;
        }

        /* 标题装饰 - 中式风格 */
        .header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            padding-bottom: 20px;
        }

        .header h1 {
            color: #8B4513;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .header p {
            color: #666;
            font-size: 18px;
            font-style: italic;
        }

        .header::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #8B4513, transparent);
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 搜索区域样式 */
        .search-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 50px;
            align-items: center;
        }

        .search-box {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 800px;
            align-items: center;
        }

        #keyword {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #d3b897;
            border-radius: 8px;
            font-size: 17px;
            outline: none;
            transition: all 0.3s ease;
            background: #fdfbf8;
        }

        #keyword:focus {
            border-color: #8B4513;
            box-shadow: 0 0 12px rgba(139, 69, 19, 0.18);
            background: #fff;
        }

        #keyword::placeholder {
            color: #999;
            font-style: italic;
        }

        #search-btn {
            padding: 16px 35px;
            background-color: #8B4513;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 500;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        #search-btn:hover {
            background-color: #A0522D;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(139, 69, 19, 0.2);
        }

        #search-btn:active {
            transform: translateY(-1px);
        }

        .search-tips {
            color: #777;
            font-size: 15px;
            max-width: 800px;
            text-align: center;
            line-height: 1.6;
        }

        .search-tips span {
            color: #8B4513;
            font-weight: bold;
        }

        /* 结果统计与筛选 */
        .result-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 20px;
            background: #f8f5f0;
            border-radius: 8px;
            border-left: 4px solid #8B4513;
        }

        .result-count {
            font-size: 16px;
            color: #555;
        }

        .result-count span {
            color: #8B4513;
            font-weight: bold;
            font-size: 18px;
        }

        .category-filter {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .category-filter label {
            font-size: 15px;
            color: #555;
        }

        #category-select {
            padding: 8px 15px;
            border: 1px solid #d3b897;
            border-radius: 6px;
            background: #fff;
            font-size: 15px;
            color: #333;
            outline: none;
            cursor: pointer;
        }

        /* 结果列表样式 - 卡片式设计 */
        .result-list {
            display: grid;
            gap: 25px;
            grid-template-columns: repeat(auto-fill, minmax(550px, 1fr));
        }

        .result-item {
            padding: 30px;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fff;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .result-item::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #8B4513;
            transition: all 0.3s ease;
        }

        .result-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            border-color: #d3b897;
        }

        .result-item:hover::before {
            width: 8px;
        }

        .item-header {
            margin-bottom: 20px;
            border-bottom: 1px dashed #e6d9c8;
            padding-bottom: 15px;
        }

        .item-name {
            font-size: 24px;
            color: #8B4513;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .item-english {
            font-size: 15px;
            color: #666;
            font-style: italic;
        }

        .item-category {
            display: inline-block;
            padding: 5px 12px;
            background: #f0e8d8;
            color: #8B4513;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
        }

        .item-content {
            font-size: 16px;
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px 15px;
        }

        .item-label {
            font-weight: bold;
            color: #8B4513;
            text-align: right;
            padding-right: 10px;
            border-right: 1px solid #f0e8d8;
        }

        .item-value {
            color: #444;
        }

        .item-reference {
            font-family: "Courier New", monospace;
            color: #2c5282;
            word-break: break-all;
        }

        .item-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-completed {
            background: #f0f9f0;
            color: #2e7d32;
        }

        /* 空结果提示样式 */
        .empty-result {
            text-align: center;
            padding: 80px 20px;
            background: #f8f5f0;
            border-radius: 12px;
            margin: 30px 0;
        }

        .empty-result .icon {
            font-size: 50px;
            color: #d3b897;
            margin-bottom: 20px;
        }

        .empty-result h3 {
            color: #8B4513;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .empty-result p {
            color: #777;
            font-size: 17px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 加载动画样式 */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f0e8d8;
            border-top: 5px solid #8B4513;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #8B4513;
            font-size: 18px;
        }

        /* 分页样式 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 50px;
            padding: 20px 0;
        }

        .page-btn {
            padding: 10px 18px;
            border: 1px solid #d3b897;
            border-radius: 6px;
            background: #fff;
            color: #8B4513;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .page-btn:hover {
            background: #f8f5f0;
            border-color: #8B4513;
        }

        .page-btn.active {
            background: #8B4513;
            color: #fff;
            border-color: #8B4513;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f8f5f0;
            color: #999;
            border-color: #eee;
        }

        .page-info {
            font-size: 16px;
            color: #666;
        }

        /* 响应式设计 - 适配移动端 */
        @media (max-width: 1200px) {
            .result-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 28px;
                letter-spacing: 2px;
            }

            .search-box {
                flex-direction: column;
                gap: 12px;
            }

            #keyword, #search-btn {
                width: 100%;
            }

            .result-info {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .category-filter {
                justify-content: center;
                width: 100%;
            }

            .item-content {
                grid-template-columns: 1fr;
            }

            .item-label {
                text-align: left;
                padding-right: 0;
                border-right: none;
                border-bottom: 1px solid #f0e8d8;
                padding-bottom: 5px;
                margin-bottom: 5px;
            }

            .pagination {
                flex-wrap: wrap;
                gap: 8px;
            }

            .page-btn {
                padding: 8px 12px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }

            .search-tips {
                font-size: 14px;
            }

            .item-name {
                font-size: 20px;
            }

            .item-content {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题区域 -->
        <div class="header">
            <h1>榫卯昭鉴</h1>
            <p>古建筑榫卯结构与文化内涵双证对照语料库</p>
        </div>

        <!-- 搜索区域 -->
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="keyword" placeholder="输入关键词检索（如：燕尾榫、榫卯类、GB/T 37646-2019、《中国建筑图解词典》）">
                <button id="search-btn">检索</button>
            </div>
            <div class="search-tips">
                <br><span>检索范围：中文术语、英文翻译、定义说明、文化注释、参考文献、分类</span>
                （示例：搜索"榫卯"获取所有榫卯类数据，搜索"GB"获取标准文献相关数据）</br>
            </div>
        </div>

        <!-- 结果信息与分类筛选 -->
        <div class="result-info" style="display: none;">
            <div class="result-count">找到 <span id="total-count">0</span> 条相关语料</div>
            <div class="category-filter">
                <label for="category-select">分类筛选：</label>
                <select id="category-select">
                    <option value="all">全部分类</option>
                    <!-- 分类选项将通过JavaScript动态生成 -->
                </select>
            </div>
        </div>

        <!-- 结果列表区域 -->
        <div id="result-container">
            <div class="empty-result">
                <div class="icon">📚</div>
                <h3>欢迎使用榫卯昭鉴语料库</h3>
                <p>本语料库收录149条古建筑榫卯相关数据，包含中文术语、英文翻译、定义说明、文化注释、参考文献等完整信息<br>请在上方输入关键词进行检索，或使用分类筛选功能浏览（若使用分类筛选功能，请直接点击上方检索按钮）</p>
            </div>
        </div>

        <!-- 分页区域 -->
        <div id="pagination" class="pagination" style="display: none;">
            <button class="page-btn" id="prev-page" disabled>上一页</button>
            <span class="page-info"><span id="current-page">1</span>/<span id="total-pages">1</span> 页</span>
            <button class="page-btn" id="next-page" disabled>下一页</button>
        </div>
    </div>

    <script>
        // 榫卯语料库完整数据（149条）
        const corpusData = [
    {
        "id": 1,
        "category": "榫卯类",
        "name": "榫卯",
        "englishName": "mortise and tenon joint",
        "definition": "在两个木构件上所采用的一种凹凸结合的连接方式，凸出部分叫榫，凹进部分叫卯。",
        "culturalNote": "起源于7000年前河姆渡文化，不用铁钉即可使构件牢固结合，体现了“以柔克刚”“阴阳互补”的哲学思想。",
        "reference": "GB/T 51330-2019",
        "status": "已完成"
    },
    {
        "id": 2,
        "category": "榫卯类",
        "name": "燕尾榫",
        "englishName": "dovetail joint",
        "definition": "榫头呈梯形，形似燕尾，用于板材角部连接，防止受拉力时脱开。",
        "culturalNote": "因形似燕尾而得名，常用于抽屉、箱柜等需要承受拉力的部位，梯形结构越拉越紧。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 3,
        "category": "榫卯类",
        "name": "银锭榫",
        "englishName": "dovetailed tenon",
        "definition": "两头大、中腰细，形似银锭的榫，用于拼合板片接长或平板角接。",
        "culturalNote": "因形似古代银锭而得名，两头宽中间细的结构使其嵌入后无法脱出，是古代用于防止拼缝开裂的经典做法。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 4,
        "category": "榫卯类",
        "name": "粽角榫",
        "englishName": "mitered mortise and tenon joint",
        "definition": "三根方材格角结合，每个转角形成45°斜线，形似粽子角，多用于四面平家具。",
        "culturalNote": "因外形酷似粽子角而得名，是三根木材在三维空间相交的典范，外观简洁内部结构极其复杂。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 5,
        "category": "榫卯类",
        "name": "抱肩榫",
        "englishName": "shoulder tenon",
        "definition": "有束腰结构家具中腿足与牙条连接的45°斜肩榫卯，腿足上端切出45度斜肩并凿三角形榫眼。",
        "culturalNote": "束腰家具中腿足与牙板连接的典型结构，45°斜肩咬合，既受力又美观，是明式家具精细工艺的代表。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 6,
        "category": "榫卯类",
        "name": "夹头榫",
        "englishName": "elongated bridle joint",
        "definition": "腿足上端开长口嵌夹牙条及牙头，使外观腿足高出牙条及牙头之上，用于案形结构。",
        "culturalNote": "案形结构家具最常用的榫卯，牙条嵌在腿足之间，使案面承重均匀传递到腿足。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 7,
        "category": "榫卯类",
        "name": "插肩榫",
        "englishName": "inserted shoulder tenon",
        "definition": "腿足顶端有半头直榫与案面大边连接，前脸做出角形斜肩，牙板剔刻槽口嵌入。",
        "culturalNote": "与夹头榫功能相似但外观不同，腿足斜肩与牙板槽口咬合，常用于桌案类家具。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 8,
        "category": "榫卯类",
        "name": "楔钉榫",
        "englishName": "wedged mortise and tenon joint",
        "definition": "连接弧形材的榫卯，两片榫头交搭，用楔钉贯穿固定，用于圈椅扶手、圆形家具。",
        "culturalNote": "专门用于连接弧形构件，两块榫头交叉搭合后再用楔钉锁死，体现古代工匠解决弧形连接难题的智慧。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 9,
        "category": "榫卯类",
        "name": "长短榫",
        "englishName": "long and short tenons",
        "definition": "腿上部凿出长短不同两个榫头，使连接更稳固，是面板与线材连接中常见的榫卯结构。",
        "culturalNote": "常用于腿足与面板连接，两个榫头一长一短，既能增加接触面，又能防止面板翘曲变形。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 10,
        "category": "榫卯类",
        "name": "穿带",
        "englishName": "through tenon",
        "definition": "薄板拼合后开槽穿嵌梯形长榫，防止横向拉开；穿带的梯形长榫从宽边推向窄边使之穿紧。",
        "culturalNote": "用于桌面、柜门等拼板背面，梯形长榫穿入燕尾槽后越推越紧，是解决木材缩涨问题的巧妙方法。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 11,
        "category": "榫卯类",
        "name": "格肩榫",
        "englishName": "shouldered tenon",
        "definition": "横竖材丁字结合，榫肩与构件表面平齐，将出榫料外半部皮子截割成等腰三角尖。",
        "culturalNote": "横竖材丁字连接的标准做法，格肩使接口严密平整，常用于桌腿与横枨连接。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 12,
        "category": "榫卯类",
        "name": "半榫",
        "englishName": "blind tenon",
        "definition": "榫头不穿透构件，隐藏于内部。",
        "culturalNote": "榫头深度小于构件厚度，使家具外表面整洁美观，多用于高档家具。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 13,
        "category": "榫卯类",
        "name": "透榫",
        "englishName": "through tenon",
        "definition": "榫头完全穿透构件，在另一侧可见。",
        "culturalNote": "榫头完全穿透构件，在大木作和民间家具中常见，既增加结构强度又有装饰效果。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 14,
        "category": "榫卯类",
        "name": "明榫",
        "englishName": "exposed tenon",
        "definition": "榫头外露可见的榫卯结构。",
        "culturalNote": "常用于民间家具和建筑大木作，便于加工和维修，体现质朴的工艺美学。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 15,
        "category": "榫卯类",
        "name": "暗榫",
        "englishName": "concealed tenon",
        "definition": "榫头隐藏不外露的榫卯结构，又称闷榫，用于几、案、箱子。",
        "culturalNote": "榫头完全隐藏，是精细工艺的体现，多用于高档家具，加工难度高于明榫。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 16,
        "category": "榫卯类",
        "name": "栽榫",
        "englishName": "planted tenon",
        "definition": "构件本身不出榫，另取木块嵌入构件作榫，又称栽销、桩头。",
        "culturalNote": "当构件本身不适合做榫时，另取一块木料做成榫头栽入构件，相当于古代的“补丁”技术。",
        "reference": "GB/T 37646-2019",
        "status": "已完成"
    },
    {
        "id": 17,

        // 全局变量
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 10; // 每页显示10条数据

        // DOM元素
        const keywordInput = document.getElementById('keyword');
        const searchBtn = document.getElementById('search-btn');
        const resultContainer = document.getElementById('result-container');
        const resultInfo = document.querySelector('.result-info');
        const totalCountSpan = document.getElementById('total-count');
        const categorySelect = document.getElementById('category-select');
        const pagination = document.getElementById('pagination');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const currentPageSpan = document.getElementById('current-page');
        const totalPagesSpan = document.getElementById('total-pages');

        // 初始化：生成分类筛选选项
        function initCategoryFilter() {
            // 获取所有分类并去重
            const categories = [...new Set(corpusData.map(item => item.category))];
            
            // 清空现有选项（保留"全部分类"）
            while (categorySelect.options.length > 1) {
                categorySelect.remove(1);
            }
            
            // 添加分类选项
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });
        }

        // 搜索功能
        function searchCorpus() {
            const keyword = keywordInput.value.trim().toLowerCase();
            
            // 显示加载状态
            showLoading();
            
            // 模拟加载延迟，提升用户体验
            setTimeout(() => {
                // 基础搜索逻辑
                if (keyword) {
                    filteredData = corpusData.filter(item => 
                        item.name.toLowerCase().includes(keyword) ||
                        item.englishName.toLowerCase().includes(keyword) ||
                        item.definition.toLowerCase().includes(keyword) ||
                        item.culturalNote.toLowerCase().includes(keyword) ||
                        item.reference.toLowerCase().includes(keyword) ||
                        item.category.toLowerCase().includes(keyword) ||
                        item.status.toLowerCase().includes(keyword)
                    );
                } else {
                    // 无关键词时显示全部数据
                    filteredData = [...corpusData];
                }
                
                // 应用分类筛选
                applyCategoryFilter();
                
                // 重置页码
                currentPage = 1;
                
                // 显示结果
                renderResults();
                
                // 更新分页
                updatePagination();
                
                // 显示结果信息
                resultInfo.style.display = 'flex';
            }, 500);
        }

        // 应用分类筛选
        function applyCategoryFilter() {
            const selectedCategory = categorySelect.value;
            
            if (selectedCategory !== 'all' && filteredData.length > 0) {
                filteredData = filteredData.filter(item => item.category === selectedCategory);
            }
        }

        // 渲染搜索结果
        function renderResults() {
            // 计算当前页显示的数据范围
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const currentPageData = filteredData.slice(startIndex, endIndex);
            
            // 检查是否有结果
            if (filteredData.length === 0) {
                showEmptyResult();
                pagination.style.display = 'none';
                return;
            }
            
            // 生成结果HTML
            let resultHtml = '<div class="result-list">';
            
            currentPageData.forEach(item => {
                resultHtml += `
                    <div class="result-item">
                        <div class="item-header">
                            <div class="item-name">${item.name}</div>
                            <div class="item-english">${item.englishName}</div>
                            <span class="item-category">${item.category}</span>
                        </div>
                        <div class="item-content">
                            <div class="item-label">定义说明：</div>
                            <div class="item-value">${item.definition}</div>
                            
                            <div class="item-label">文化注释：</div>
                            <div class="item-value">${item.culturalNote}</div>
                            
                            <div class="item-label">参考文献：</div>
                            <div class="item-value item-reference">${item.reference}</div>
                            
                            <div class="item-label">数据状态：</div>
                            <div class="item-value">
                                <span class="item-status status-completed">${item.status}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            resultHtml += '</div>';
            
            // 更新结果容器
            resultContainer.innerHTML = resultHtml;
            
            // 更新结果计数
            totalCountSpan.textContent = filteredData.length;
            
            // 显示分页
            pagination.style.display = 'flex';
        }

        // 更新分页控件
        function updatePagination() {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            
            // 更新页码显示
            currentPageSpan.textContent = currentPage;
            totalPagesSpan.textContent = totalPages;
            
            // 更新按钮状态
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages || filteredData.length === 0;
        }

        // 显示加载状态
        function showLoading() {
            resultContainer.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在检索语料，请稍候...</p>
                </div>
            `;
            resultInfo.style.display = 'none';
            pagination.style.display = 'none';
        }

        // 显示空结果状态
        function showEmptyResult() {
            resultContainer.innerHTML = `
                <div class="empty-result">
                    <div class="icon">🔍</div>
                    <h3>未找到相关语料</h3>
                    <p>请尝试调整关键词或分类筛选条件<br>建议使用更宽泛的关键词，或查看全部语料</p>
                </div>
            `;
        }

        // 分页按钮点击事件
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderResults();
                updatePagination();
                // 滚动到结果顶部
                resultContainer.scrollIntoView({ behavior: 'smooth' });
            }
        });

        nextPageBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderResults();
                updatePagination();
                // 滚动到结果顶部
                resultContainer.scrollIntoView({ behavior: 'smooth' });
            }
        });

        // 分类筛选变化事件
        categorySelect.addEventListener('change', () => {
            // 显示加载状态
            showLoading();
            
            // 模拟加载延迟
            setTimeout(() => {
                // 重置页码
                currentPage = 1;
                
                // 重新应用筛选
                const keyword = keywordInput.value.trim().toLowerCase();
                if (keyword) {
                    filteredData = corpusData.filter(item => 
                        item.name.toLowerCase().includes(keyword) ||
                        item.englishName.toLowerCase().includes(keyword) ||
                        item.definition.toLowerCase().includes(keyword) ||
                        item.culturalNote.toLowerCase().includes(keyword) ||
                        item.reference.toLowerCase().includes(keyword) ||
                        item.category.toLowerCase().includes(keyword) ||
                        item.status.toLowerCase().includes(keyword)
                    );
                } else {
                    filteredData = [...corpusData];
                }
                
                // 应用分类筛选
                applyCategoryFilter();
                
                // 显示结果
                renderResults();
                
                // 更新分页
                updatePagination();
            }, 300);
        });

        // 搜索按钮点击事件
        searchBtn.addEventListener('click', searchCorpus);

        // 回车键触发搜索
        keywordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                searchCorpus();
            }
        });

        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            // 初始化分类筛选
            initCategoryFilter();
            
            // 自动聚焦搜索框
            keywordInput.focus();
        });
    </script>
</body>
</html>
